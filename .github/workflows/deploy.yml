name: CI/CD Pipeline

# Trigger: runs every time you push to the main branch
on:
  push:
    branches:
      - main

jobs:

  # -----------------------------------------------------------------------
  # JOB 1: Run unit tests
  # If tests fail, the pipeline stops here — image is never built or pushed
  # -----------------------------------------------------------------------
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r Flask_test_ECS/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s Flask_test_ECS -p "test_*.py" -v

  # -----------------------------------------------------------------------
  # JOB 2: Build and push Docker image
  # Only runs if tests pass
  # -----------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test        # waits for 'test' job to pass first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-api:latest ./Flask_test_ECS

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-api:latest
